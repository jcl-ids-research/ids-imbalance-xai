name: quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        run: uv sync --python 3.10 --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Formatting
        run: uv run ruff format --check src tests scripts

      - name: Tests and coverage
        run: >-
          uv run pytest -q
          --cov=ids_diffusion
          --cov-report=term
          --cov-fail-under=70

      - name: Type debt does not grow
        run: uv run python scripts/check_type_debt.py

      - name: End-to-end pipeline on every reported dataset and task
        run: uv run pytest -m slow -q

      - name: Paper claims reproduce from the archived results
        run: uv run ids-reproduce claims

      - name: Reproduction matrix is enumerable
        run: uv run ids-reproduce plan

      - name: Experiment families resolve to real sources and evidence
        run: uv run ids-reproduce audit

      - name: Citation metadata is valid CFF 1.2
        run: uv run cffconvert --validate -i CITATION.cff

      - name: Build wheel and source distribution
        run: uv build
