[experiment]
name = "rm-dmvt-baseline"
seeds = [42, 123, 456]
output_root = "runs"

[data]
dataset = "unsw"
task = "binary"
root = "/opt/UNSW-NB15"
validation_fraction = 0.10
attack_keep_fraction = 1.0

[diffusion]
timesteps = 500
hidden = [256, 256, 256]
epochs = 1000
batch_size = 1024
learning_rate = 0.001
discrete_correction = true

[model]
d_model = 128
n_heads = 8
n_layers = 4
dim_feedforward = 512
dropout = 0.10
view_mode = "semantic"
fusion_mode = "linear"

[training]
epochs = 30
batch_size = 256
learning_rate = 0.0001
weight_decay = 0.00001
patience = 5
expansion_cap = 15
