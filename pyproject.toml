[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-diffusion"
version = "0.1.0"
description = "Diffusion-augmented multi-view intrusion detection training and tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "optuna>=3.4",
    "polars>=0.20",
    "rich>=13.7",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "typer>=0.12",
    "typing-extensions>=4.8",
    "xgboost>=2.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
]

[project.scripts]
ids-prepare = "ids_diffusion.cli.prepare:app"
ids-reproduce = "ids_diffusion.cli.reproduce:app"
ids-freeze-split = "ids_diffusion.cli.freeze:app"
ids-prepare-holdout = "ids_diffusion.cli.prepare_holdout:app"
ids-baseline = "ids_diffusion.cli.baseline:app"
ids-train = "ids_diffusion.cli.train:app"
ids-tune = "ids_diffusion.cli.tune:app"
ids-confirm = "ids_diffusion.cli.confirm:app"
ids-eval = "ids_diffusion.cli.evaluate:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ids_diffusion = ["py.typed"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.10"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", "legacy"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = ["legacy"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    "TC001",
    "TC002",
    "TC003",
    "D105",
    "D107",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D", "E402"]
"src/ids_diffusion/cli/**/*.py" = ["T201", "PLR0913", "PLR0917"]
# Operational helpers: they report on runs and drive the server. Reporting
# thresholds, plotting import style and short helper functions are held to a
# lighter standard than the package, but real defects are not ignored.
"scripts/**/*.py" = [
    "T201",
    "INP001",
    "E402",
    "D103",
    "PLR2004",
    "C901",
    "ICN001",
    "TRY003",
    "EM102",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: end-to-end pipeline runs; excluded by default, run with -m slow",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]
